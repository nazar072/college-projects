<!DOCTYPE html>
<html>
<head>
  <title>Tic-Tac-Toe</title>
  <style>
    td button { width: 60px; height: 60px; background-color: white; }
    span { padding: 5px; }
  </style>
</head>
<body>
  <h1>Tic-Tac-Toe</h1>
  <p>Red starts. Get three squares of your color in a line.</p>

  <table>
    <tr>
      <td><button id="box1"></button></td>
      <td><button id="box2"></button></td>
      <td><button id="box3"></button></td>
    </tr>
    <tr>
      <td><button id="box4"></button></td>
      <td><button id="box5"></button></td>
      <td><button id="box6"></button></td>
    </tr>
    <tr>
      <td><button id="box7"></button></td>
      <td><button id="box8"></button></td>
      <td><button id="box9"></button></td>
    </tr>
  </table>

  <p>
    <span id="redTurn">Red's turn</span>
    <span id="blueTurn">Blue's turn</span>
    <span id="redWins">Red wins</span>
    <span id="blueWins">Blue wins</span>
    <span id="draw">Draw</span>
  </p>
  <button id="restart">Restart</button>

<script>
{
  let player = "red";
  let moves = 0;
  let gameOver = false;
  let status = document.getElementById("redTurn");

  let box1 = document.getElementById("box1");
  let box2 = document.getElementById("box2");
  let box3 = document.getElementById("box3");
  let box4 = document.getElementById("box4");
  let box5 = document.getElementById("box5");
  let box6 = document.getElementById("box6");
  let box7 = document.getElementById("box7");
  let box8 = document.getElementById("box8");
  let box9 = document.getElementById("box9");
  let restart = document.getElementById("restart");

  status.style.backgroundColor = "gold";

  let showStatus = function (id) {
    status.style.backgroundColor = "";
    status = document.getElementById(id);
    status.style.backgroundColor = "gold";
  };

  let sameColor = function (first, second, third) {
    return first.style.backgroundColor === player &&
           second.style.backgroundColor === player &&
           third.style.backgroundColor === player;
  };

  let play = function (box) {
    if (gameOver || box.style.backgroundColor !== "") {
      return;
    }

    box.style.backgroundColor = player;
    moves = moves + 1;

    // Check the three rows, three columns, and two diagonals.
    if (sameColor(box1, box2, box3) ||
        sameColor(box4, box5, box6) ||
        sameColor(box7, box8, box9) ||
        sameColor(box1, box4, box7) ||
        sameColor(box2, box5, box8) ||
        sameColor(box3, box6, box9) ||
        sameColor(box1, box5, box9) ||
        sameColor(box3, box5, box7)) {
      gameOver = true;
      showStatus(player + "Wins");
    } else if (moves === 9) {
      gameOver = true;
      showStatus("draw");
    } else if (player === "red") {
      player = "blue";
      showStatus("blueTurn");
    } else {
      player = "red";
      showStatus("redTurn");
    }
  };

  box1.addEventListener("click", function () {
    play(box1);
  });
  box2.addEventListener("click", function () {
    play(box2);
  });
  box3.addEventListener("click", function () {
    play(box3);
  });
  box4.addEventListener("click", function () {
    play(box4);
  });
  box5.addEventListener("click", function () {
    play(box5);
  });
  box6.addEventListener("click", function () {
    play(box6);
  });
  box7.addEventListener("click", function () {
    play(box7);
  });
  box8.addEventListener("click", function () {
    play(box8);
  });
  box9.addEventListener("click", function () {
    play(box9);
  });

  restart.addEventListener("click", function () {
    for (let i = 1; i <= 9; i = i + 1) {
      let box = document.getElementById("box" + i);
      box.style.backgroundColor = "";
    }

    player = "red";
    moves = 0;
    gameOver = false;
    showStatus("redTurn");
  });
}
</script>
</script>
</body>
</html>
